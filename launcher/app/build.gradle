plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    // CI sets these for release builds. The defaults match the upstream source tree.
    def releaseStore = System.getenv('TVHOME_KEYSTORE')
    def releaseStorePassword = System.getenv('TVHOME_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('TVHOME_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('TVHOME_KEY_PASSWORD')
    def hasReleaseKey = releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        // CI keeps the upstream fallback so its build fixtures stay unchanged; release.yml passes
        // -PlauncherApplicationId=tv.homelauncher.app (neutral, no personal name) by default.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('launcherVersionCode').getOrElse('12').toInteger()
        versionName providers.gradleProperty('launcherVersionName').getOrElse('3.3')
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // A small PKCS#12 file is easier to create without keytool and works with apksigner.
                storeType System.getenv('TVHOME_STORE_TYPE') ?: 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // With a CI keystore the release is upgradeable from any earlier signed build. Without
            // one this is a test APK and is labelled debug-signed; the release workflow says so.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Test only: the merge test runs on the JVM, where android.jar's org.json methods are stubs.
    testImplementation 'org.json:json:20240303'
}
