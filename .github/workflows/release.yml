name: Release APK

# Manual runs produce a downloadable test APK. A v* tag produces a GitHub Release. The APK is
# signed with the repository keystore when the secrets exist; otherwise it is debug-signed and the
# run says so. A tag never publishes a debug-signed APK.

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: "launcherApplicationId (package name)"
        default: "com.gathin.tvhome.atv"
      version_code:
        description: "versionCode (integer, higher than the installed build)"
        default: "1000"
      version_name:
        description: "versionName"
        default: "3.3-settings"
      publish:
        description: "Create a GitHub Release from this run"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_ID: ${{ inputs.application_id || 'com.gathin.tvhome.atv' }}
  VERSION_CODE: ${{ inputs.version_code || '1000' }}
  VERSION_NAME: ${{ inputs.version_name || '3.3-settings' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: "Signing key"
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/home-launcher.p12"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using the repository release keystore."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret: this APK is debug-signed and not upgradeable from a release build."
          fi

      - name: "Version from tag"
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: "Build, test and lint"
        working-directory: launcher
        env:
          TVHOME_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TVHOME_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          TVHOME_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          TVHOME_STORE_TYPE: ${{ secrets.KEYSTORE_STORE_TYPE }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            export TVHOME_KEYSTORE="$RUNNER_TEMP/home-launcher.p12"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -z "${TVHOME_KEYSTORE:-}" ]; then
            echo "::error::A tagged release needs KEYSTORE_BASE64 and the password secrets."
            exit 1
          fi
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease \
            -PlauncherApplicationId="$APP_ID" \
            -PlauncherVersionCode="$VERSION_CODE" \
            -PlauncherVersionName="$VERSION_NAME"

      - name: "Verify the APK"
        run: |
          set -euo pipefail
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/34.* | tail -1)
          ls -lh "$APK"
          "$BT/aapt" dump badging "$APK" | head -1
          "$BT/apksigner" verify --print-certs "$APK" | tee apk-certs.txt
          sha256sum "$APK" | tee apk.sha256
          size=$(stat -c %s "$APK")
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 1572864 || { echo "::error::APK is over 1.5 MB"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: home-launcher-${{ github.run_number }}
          path: |
            launcher/app/build/outputs/apk/release/app-release.apk
            apk.sha256
            apk-certs.txt
          if-no-files-found: error
          retention-days: 30

      - name: "Publish release"
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('launcher-{0}', github.run_number) }}
          name: "Home Launcher ${{ env.VERSION_NAME }}"
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            launcher/app/build/outputs/apk/release/app-release.apk
            apk.sha256
            apk-certs.txt
          body: |
            Built from `${{ github.sha }}`.
            Package: `${{ env.APP_ID }}` · version `${{ env.VERSION_NAME }}` (`${{ env.VERSION_CODE }}`).
            Signed with: `${{ steps.signing.outputs.available == 'true' && 'repository release keystore' || 'debug key (test build)' }}`.
