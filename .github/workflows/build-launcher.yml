name: Build launcher APK

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: "launcherApplicationId (package name)"
        default: "com.gathin.tvhome"
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: "Android SDK 34"
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          [ -n "$SDKMGR" ] || { echo "no sdkmanager under $SDK"; exit 1; }
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PlauncherApplicationId="${{ inputs.application_id || 'com.gathin.tvhome' }}"

      - name: "Check the APK"
        run: |
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/34.* | tail -1)
          "$BT/aapt" dump badging "$APK" | head -1
          sha256sum "$APK" | tee apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-release
          path: launcher/app/build/outputs/apk/release/app-release.apk

      - name: "Publish release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-3.1-${{ github.run_number }}-${{ github.run_attempt }}
          name: "Home Launcher 3.1 build ${{ github.run_number }}"
          files: launcher/app/build/outputs/apk/release/app-release.apk
          body: "Built from ${{ github.sha }}; applicationId `${{ inputs.application_id || 'com.gathin.tvhome' }}`."
